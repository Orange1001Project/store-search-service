# 로컬: infra/.env(docker-compose와 같은 파일)에서 DB 접속 값을 읽는다. backend 폴더에서 실행할 때 기준 경로.
# 서버: 같은 이름의 환경 변수를 주면 그 값이 우선한다.
spring:
  config:
    import: optional:file:../infra/.env[.properties]
  application:
    name: storesearch
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:storesearch}
    username: ${POSTGRES_USER:storesearch}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 표는 JPA가 만들지 않는다(파티션·조건부 인덱스·geography·vector). 구조는 Flyway(db/migration)로만.
      ddl-auto: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 각 항목(db 등)의 UP·DOWN만 보이고, 경로·접속 정보 같은 세부 내용은 숨긴다
      show-components: always
      show-details: never
