plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.27.0'
}

group = 'com.storesearch'
version = '0.0.1-SNAPSHOT'
description = 'Store search API server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'   // 임베딩 서버 호출
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.dhatim:fastexcel-reader:0.20.2'   // 원천 엑셀(22만 행)을 스트리밍으로 읽음
	implementation 'org.postgresql:postgresql'            // 스냅샷 적재에 COPY API를 씀
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.dhatim:fastexcel:0.20.2'   // 테스트용 엑셀 만들기
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// API 명세(docs/api/openapi.yaml)에서 컨트롤러 인터페이스와 DTO를 만든다(API_RULES.md 12절).
// 결과는 build/에만 생기고 git에 올리지 않는다. 명세를 고치면 다음 빌드 때 다시 만들어진다.
openApiGenerate {
	generatorName = 'spring'
	library = 'spring-boot'
	inputSpec = "$rootDir/../docs/api/openapi.yaml".toString()
	outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.path
	apiPackage = 'com.storesearch.api'
	modelPackage = 'com.storesearch.api.model'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		interfaceOnly       : 'true',
		useSpringBoot4      : 'true',
		useJackson3         : 'true',
		useTags             : 'true',
		openApiNullable     : 'false',
		skipDefaultInterface: 'true',
		useBeanValidation   : 'true',
		containerDefaultToNull: 'true',
		documentationProvider: 'none',
		annotationLibrary   : 'none',
		dateLibrary         : 'java8',
		sourceFolder        : 'src/main/java',
	]
}

sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/openapi/src/main/java'))

// 레포의 seed/ 기준 데이터를 classpath:seed/ 로 넣는다(파일은 seed/에만 두고 복사하지 않음)
tasks.named('processResources') {
	from("$rootDir/../seed") { into 'seed' }
}
tasks.named('compileJava') { dependsOn 'openApiGenerate' }

tasks.named('test') {
	useJUnitPlatform()
}
