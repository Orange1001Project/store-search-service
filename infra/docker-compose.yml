# 로컬 개발용 Docker Compose (docs/dev/LOCAL_DEV_SETUP.md)
# - db: PostgreSQL 16 + PostGIS 3(2026-11 빌드 시 3.7) + pgvector 0.8 (infra/db/Dockerfile). 빈 DB만 만든다. 표는 API 서버가 뜰 때 Flyway가 만든다(backend/src/main/resources/db/migration).
# - embedding: 임베딩 추론 서버(embedding-server/, CPU). 모델 폴더는 .env의 EMBEDDING_MODEL_DIR(비우면 저장소 models/ 아래, git 제외)
# API 서버(Spring)와 화면(React)은 IDE에서 실행한다. Redis는 쓰지 않는다(docs/ARCHITECTURE.md 6-6).
#
# 사용: infra 폴더에서
#   cp .env.example .env          # POSTGRES_PASSWORD, EMBEDDING_MODEL_DIR 채우기
#   docker compose up -d db       # DB만(화면만 개발할 때)
#   docker compose up -d          # DB + 임베딩 서버
name: storesearch

services:
  db:
    build: ./db
    image: storesearch-db:16-postgis3-pgvector0.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storesearch}
      POSTGRES_USER: ${POSTGRES_USER:-storesearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env에 POSTGRES_PASSWORD를 넣으세요}
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-2GB}
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # 이 PC에서만 접속
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1(TCP): 처음 만들 때 초기화용 임시 서버는 TCP를 열지 않으므로, 초기화가 끝난 뒤에야 healthy가 된다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  embedding:
    build: ../embedding-server
    image: storesearch-embedding:cpu
    environment:
      TORCH_THREADS: ${EMBEDDING_THREADS:-0}   # 0 = torch 기본(코어 수)
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8001}:8001"   # 이 PC에서만 접속
    volumes:
      - ${EMBEDDING_MODEL_DIR:-../models/bge_m3_ft_mj_20261014_0743}:/models/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

volumes:
  db-data:
